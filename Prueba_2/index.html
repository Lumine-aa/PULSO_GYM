<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSO - Entrenamiento Vital</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-container" class="auth-wrapper">
        <div class="login-box">
            <div class="login-brand">
                <div class="login-logo-stage">
                    <img class="login-logo" src="assets/pulso-logo.png" alt="PULSO Entrenamiento Vital">
                    <svg class="ecg-trace login-ecg-trace" viewBox="0 0 853 257" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                        <defs>
                            <linearGradient id="ecg-gradient-login" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#00FE0A" />
                                <stop offset="50%" stop-color="#ffffff" />
                                <stop offset="100%" stop-color="#00FE0A" />
                            </linearGradient>
                        </defs>
                        <path d="M 262 190 L 386 193 L 420 12 L 446 211 L 481 166 L 500 166" pathLength="100" />
                    </svg>
                </div>
                <p class="login-brand-caption">Sistema de Gestión</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="admin@pulso.com">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-field">
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3.2"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9M6.2 6.3C3.5 8.1 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"></path>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Ingresar</button>
                <p id="login-error" class="error-msg"></p>
            </form>
            <p class="login-switch">¿Primera vez en PULSO?
    <button type="button" class="link-btn" data-action="abrir-modal-registro">Crea tu cuenta</button>
</p>
        </div>
    </div>

    <!-- PANEL DE CONTROL -->
    <div id="dashboard-container" class="dashboard-wrapper hidden">
        <aside class="sidebar">
            <div class="sidebar-logo-stage">
                <img class="sidebar-logo" src="assets/pulso-logo.png" alt="PULSO Entrenamiento Vital">
                <svg class="ecg-trace sidebar-ecg-trace" viewBox="0 0 853 257" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <defs>
                        <linearGradient id="ecg-gradient-sidebar" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#00FE0A" />
                            <stop offset="50%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#00FE0A" />
                        </linearGradient>
                    </defs>
                    <path d="M 262 190 L 386 193 L 420 12 L 446 211 L 481 166 L 500 166" pathLength="100" />
                </svg>
            </div>
            <nav>
                <ul id="menu"></ul>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-status">
                    <span class="pulse-dot"></span>
                    <span>Sistema en línea</span>
                </div>
                <button id="logout-btn" class="btn-secondary">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h2 id="vista-titulo">Inicio</h2>
                    <p id="vista-subtitulo" class="header-sub"></p>
                </div>
                <div class="header-right">
                    <span id="fecha-actual" class="date-pill"></span>
                    <div class="user-info">
                        <span id="user-nombre">Cargando...</span>
                        <span id="user-rol" class="rol-badge"></span>
                    </div>
                </div>
            </header>

            <!-- Contenido dinámico según el rol -->
            <section id="vista"></section>
        </main>
    </div>

    <!-- MODAL PARA FORMULARIOS Y CONFIRMACIONES -->
    <div id="modal-container" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-titulo">Acción</h3>
                <button type="button" id="modal-cerrar" class="modal-close" aria-label="Cerrar">&times;</button>
            </div>
            <div id="modal-cuerpo"></div>
        </div>
    </div>

    <!-- NOTIFICACIONES FLOTANTES -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
